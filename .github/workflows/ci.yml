name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装项目与开发依赖
        run: pip install -e ".[dev]"
      - name: 静态检查
        run: ruff check src tests
      - name: 行为测试
        run: python -m pytest
      - name: 校验真实仓库
        run: sutra validate .
